[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/cqlx"
homepage = "https://github.com/Max-imalgutaussehend/cqlx"
rust-version = "1.88"
keywords = ["cassandra", "scylla", "cql", "orm", "macros"]
categories = ["database", "development-tools"]
authors = ["Max-imalgutaussehend"]

[workspace.dependencies]
cqlx-core = { path = "crates/cqlx-core", version = "0.1.0" }
cqlx-macros = { path = "crates/cqlx-macros", version = "0.1.0" }
cqlx = { path = "crates/cqlx", version = "0.1.0" }
scylla = "1.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
