name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start ScyllaDB
        run: docker run -d --name scylla -p 9042:9042 scylladb/scylla --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
      - name: ScyllaDB integration tests
        env:
          CQLX_TEST_NODE: 127.0.0.1:9042
        run: cargo test -p cqlx --test scylla_integration -- --ignored
