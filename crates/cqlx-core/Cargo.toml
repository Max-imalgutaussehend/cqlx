[package]
name = "cqlx-core"
description = "Core traits, metadata, type-state query plumbing and session wrapper for cqlx, the code-first ScyllaDB/Cassandra ORM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = []
# Attribute parsing and Rust-type -> CQL-type mapping. Used by cqlx-macros and cqlx-cli.
parse = ["dep:syn", "dep:proc-macro2", "dep:quote"]

[dependencies]
scylla = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
syn = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
