[package]
name = "cqlx-cli"
description = "Extracts CqlEntity schemas from Rust source, generates CREATE TABLE CQL and diffs against existing schemas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "cqlx"
path = "src/main.rs"

[dependencies]
cqlx-core = { workspace = true, features = ["parse"] }
cqlc-core = "1.1"
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"

[lib]
name = "cqlx_cli"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
